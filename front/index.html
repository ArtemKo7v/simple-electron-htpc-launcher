<!doctype html>
<html style="height: 100%; overflow: hidden;">
<head>
  <meta charset="utf-8">
  <title>Launcher</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark">
  <div id="app" class="container-fluid p-3">
    <div id="header" class="d-flex justify-content-between align-items-center mb-3">
      <div id="title">Launcher</div>
      <div id="clock">--:--:--</div>
    </div>
    <div id="buttons-area" class="mb-3"></div>
    <!-- WebView modal -->
    <div id="webviewModal" class="d-none">
      <div class="webview-header d-flex justify-content-between">
        <button id="webview-close" class="btn btn-sm btn-light">Close</button>
      </div>
      <webview id="webview" src="" style="width:100%;height:80vh" allowpopups></webview>
    </div>
  </div>
  <script src="vendor/jquery-3.7.0.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
